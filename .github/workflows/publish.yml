# Publishes whytrail to the public npm registry on a v* tag via npm trusted
# publishing. The workflow's short-lived OIDC token authenticates the push.
# No NPM_TOKEN and no NODE_AUTH_TOKEN secret exists or is used.
#
# One-time bootstrap: npm only lets a package get a trusted publisher once the
# package exists. Publish 0.1.0 once by hand (owner `npm login`, then
# `npm publish --access public` from the verified tarball). Then the owner
# registers this workflow as a Trusted Publisher on npmjs.com: package
# whytrail → Settings → Trusted Publisher → <owner>/whytrail, workflow
# publish.yml. Every later v* tag publishes from Actions.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      # Trusted publishing (OIDC-authenticated PUT) requires npm >= 11.5.
      - run: npm install -g npm@11.6.2
      # No lockfile is committed yet; switch to `bun install --frozen-lockfile`
      # when one lands.
      - run: bun install
      - run: bun test
      - name: tag must equal v plus package.json version
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$GITHUB_REF_NAME version=v$ver"
          test "$GITHUB_REF_NAME" = "v$ver"
      # whytrail's repo is public, so npm accepts the provenance bundle
      # (private repos get E422 and must omit --provenance).
      - run: npm publish --access public --provenance
